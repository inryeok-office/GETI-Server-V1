spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/geti}
    username: ${DATABASE_USERNAME:geti}
    password: ${DATABASE_PASSWORD:geti-local-only}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    # Local Docker Compose의 elasticsearch Service는 인증 없는 격리된 개발 환경이다
    # (docs/development/docker.md 참고, Issue #69). 인증이 필요하면 ELASTICSEARCH_USERNAME/
    # ELASTICSEARCH_PASSWORD로 재정의한다.
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

# Local 전용 임시 Secret이다(운영에서 재사용 금지). 실제 값을 채운 .env는 Commit되지 않는다.
# GOOGLE_CLIENT_ID/SECRET을 비워두면 Google 로그인 자체는 실패하지만 App은 정상 기동한다.
app:
  file:
    storage:
      # compose.yaml의 MinIO Container를 그대로 쓴다. Access Key를 명시하므로
      # StaticCredentialsProvider가 선택된다(운영은 이 두 값을 주지 않아 IAM Role을 쓴다).
      # 이 값들은 Local 전용이며 운영에서 재사용할 수 없다(docs/development/docker.md).
      endpoint: http://localhost:${MINIO_API_PORT:9000}
      region: us-east-1
      bucket: ${FILE_STORAGE_BUCKET:geti-local}
      path-style-access: true
      access-key: ${MINIO_ROOT_USER:geti-local}
      secret-key: ${MINIO_ROOT_PASSWORD:geti-local-minio}
      # 개발자가 MinIO Console에서 Bucket을 수동으로 만들지 않아도 되게 한다. 운영에서는
      # 기본값(false) 그대로 두어 앱이 Bucket을 만들지 않는다.
      auto-create-bucket: true
  jwt:
    secret: ${JWT_SECRET:local-development-only-jwt-secret-please-do-not-use-in-production}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    # DG(DataGSM) OAuth. local은 개발용 인증 서버(localhost:8081)를 기본값으로 쓴다.
    dg:
      client-id: ${DG_CLIENT_ID:}
      client-secret: ${DG_CLIENT_SECRET:}
      redirect-uri: ${DG_REDIRECT_URI:http://localhost:8080/api/v1/auth/dg/callback}
      authorization-server: ${DG_AUTHORIZATION_SERVER:http://localhost:8081}
      resource-server: ${DG_RESOURCE_SERVER:https://oauth.resource.datagsm.kr}

logging:
  level:
    team.inreok.getiserver: DEBUG
