spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  elasticsearch:
    # 안전하지 않은 기본값(localhost 등)을 두지 않는다 — 값이 없으면 기동을 거부한다(Issue #69).
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

app:
  auth:
    refresh-cookie:
      # 운영은 HTTPS 전용이므로 Refresh Token Cookie에 Secure를 강제한다(Issue #105).
      # local/common은 HTTP라 기본값 false를 쓴다(RefreshTokenCookieFactory 참고).
      secure: true
  file:
    storage:
      # 안전하지 않은 기본값을 두지 않는다 — 값이 없으면 기동을 거부한다(elasticsearch.uris와 동일).
      bucket: ${FILE_STORAGE_BUCKET}
      region: ${FILE_STORAGE_REGION}
      # endpoint를 비워 AWS 기본 Endpoint를 쓰고, Virtual Hosted Style을 사용한다.
      path-style-access: false
      # access-key/secret-key를 의도적으로 선언하지 않는다. 그래야 DefaultCredentialsProvider가
      # EC2 Instance Profile(IAM Role)에서 자격증명을 받아오고, 장기 Access Key를 서버·Secret·
      # Compose 어디에도 두지 않게 된다.
      #
      # 선행 조건: 앱이 Container 안에서 돌기 때문에 EC2 Metadata hop limit이 2 이상이어야
      # IMDS에 닿는다. 기본값 1이면 자격증명 획득에 실패해 모든 S3 호출이 실패한다
      # (docs/file/file-domain-plan.md §14.3).
      #
      # 운영 Bucket은 앱이 만들지 않는다(auto-create-bucket 기본값 false 유지).
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    # DG(DataGSM) OAuth. 서버 URL은 운영 기본값을 두되 환경 변수로 재정의할 수 있다.
    dg:
      client-id: ${DG_CLIENT_ID}
      client-secret: ${DG_CLIENT_SECRET}
      redirect-uri: ${DG_REDIRECT_URI}
      authorization-server: ${DG_AUTHORIZATION_SERVER:https://oauth.authorization.datagsm.kr}
      resource-server: ${DG_RESOURCE_SERVER:https://oauth.resource.datagsm.kr}

# Swagger UI/OpenAPI JSON은 운영 환경에 노출하지 않는다(docs/ai/openapi-documentation.md 참고).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
