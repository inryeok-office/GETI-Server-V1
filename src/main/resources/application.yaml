spring:
  application:
    name: GETI-Server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      # 미설정으로 두면 Spring 기본값이 1MB라 사실상 모든 업로드가 막힌다. 아래 app.file.policies의
      # 어떤 max-size-bytes보다도 커야 하며, FilePolicyMultipartGuard가 기동 시점에 검증한다.
      max-file-size: 20MB
      max-request-size: 25MB
  profiles:
    # develop Profile은 local의 PostgreSQL/Redis/JWT 등 Infra 기본값을 그대로 재사용하고
    # Collector Seed 기본값만 다르게 둔다(Issue #62, docs/development/cd.md). Profile Group을
    # 활성화하면 develop과 local이 함께 활성화되어 application-local.yaml도 적용된다.
    group:
      develop: local

# JWT Access/Refresh Token 만료 시간(초). Secret은 Profile별 실제 값이 필요해 여기(공통 설정)에는
# 두지 않고 application-local.yaml/application-prod.yaml에서만 정의한다(datasource 설정과 동일한 방식).
#
# app.oauth.google.*는 의도적으로 spring.security.oauth2.client.registration.* 이름을 쓰지 않는다.
# 그 이름을 쓰면 client-id가 비어 있어도 Spring Boot OAuth2 Client 자동 설정이 시작 시점에
# ClientRegistration을 만들려다 실패해 App 기동 자체가 막힌다(Google 미설정 상태에서도 App은
# 정상 기동해야 하므로). ClientRegistration은 OAuthLoginServiceImpl이 이 값으로 직접 만든다.
app:
  # 목적별 업로드 정책이다(File 도메인 요구사항 §7, Issue #85).
  #
  # 아래 확장자·MIME·크기·개수는 모두 **잠정값**이다. GETI Notion에 확정된 숫자가 없어
  # docs/file/file-domain-plan.md §17에 DECISION_REQUIRED로 남겼다. 값이 확정되면 이 설정만
  # 교체하면 되고 코드 변경·재배포가 필요 없다.
  #
  # SVG는 어떤 목적에서도 허용하지 않는다 — 스크립트를 품을 수 있어 다운로드 시 attachment로
  # 강등되는데, 로고·프로필처럼 화면에 표시해야 하는 용도와 모순되기 때문이다(§27/§28).
  file:
    # docx(및 hwpx 같은 다른 OOXML/ZIP Container 형식)는 의도적으로 빼 두었다. 지금 의존성
    # (tika-core 단독)에는 Container 내부를 여는 판정기가 없어 확장자만 docx로 바꾼 임의의 ZIP이
    # 내용 검증을 그대로 통과한다. "실제 파일 형식 검증"(요구사항 §8/§27)이 성립하지 않는 형식은
    # 허용하지 않는다. 다시 허용하려면 tika-parsers-standard-package 도입 여부를 먼저 결정해야
    # 한다(FileContentTypeValidator의 Class 주석 참고).
    policies:
      PROFILE_IMAGE:
        extensions: [png, jpg, jpeg, webp]
        mime-types: [image/png, image/jpeg, image/webp]
        max-size-bytes: 5242880       # 5MB
        max-count: 1
      COMPANY_LOGO:
        extensions: [png, jpg, jpeg, webp]
        mime-types: [image/png, image/jpeg, image/webp]
        max-size-bytes: 2097152       # 2MB
        max-count: 1
      JOB_ATTACHMENT:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      PROGRAM_ATTACHMENT:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      JOB_APPLICATION:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      PROGRAM_APPLICATION:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      INQUIRY_ATTACHMENT:
        extensions: [png, jpg, jpeg, pdf]
        mime-types: [image/png, image/jpeg, application/pdf]
        max-size-bytes: 5242880       # 5MB
        max-count: 3
      # 문의 답변 첨부파일. 정확한 개수/용량이 명세에 확정되지 않아(GETI Inquiry 도메인 개발
      # 요구사항 83절 4번, DECISION_REQUIRED) 문의 본문 첨부(INQUIRY_ATTACHMENT)와 같은 값을
      # 임시로 적용했다.
      INQUIRY_ANSWER_ATTACHMENT:
        extensions: [png, jpg, jpeg, pdf]
        mime-types: [image/png, image/jpeg, application/pdf]
        max-size-bytes: 5242880       # 5MB
        max-count: 3
      PORTFOLIO:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 20971520      # 20MB
        max-count: 5
    # 일괄 다운로드(ZIP) 상한이다(Issue #154, File 도메인 Epic #84 Phase 6, Issue #138 요구사항). 아래 두
    # 값도 policies와 마찬가지로 **잠정값**이다(docs/file/file-domain-plan.md §17
    # DECISION_REQUIRED #10). max-total-size-bytes는 압축 전 원본 크기 합으로 검사한다.
    archive:
      max-file-count: 100
      max-total-size-bytes: 524288000  # 500MB
  jwt:
    access-token-expiration-seconds: 1800
    refresh-token-expiration-seconds: 1209600
  oauth:
    google:
      scope: openid,email,profile
  web:
    oauth:
      # Web Client의 OAuth 로그인 완료 Redirect 대상이다(OAuth Web Callback 결함 수정, Issue
      # #162). GETI Notion/Figma 어디에도 확정된 Frontend URL이 없어(DECISION_REQUIRED, PR 본문
      # 참고) 근거 없는 값을 채우지 않는다. 비어 있으면(기본값) `/authorize`에 clientType=WEB을
      # 지정해도 OAuthWebRedirectNotConfiguredException(500)으로 실패한다 -- Web Redirect
      # 기능이 아직 켜지지 않은 상태라는 뜻이다(clientType 미지정 App 등 기존 호출자에는 영향이
      # 없다). 실제 Frontend URL이 확정되면 환경 변수로 채운다.
      callback-redirect-url: ${APP_WEB_OAUTH_CALLBACK_REDIRECT_URL:}
  ai:
    # OpenAI Responses API 연동 설정이다(AI Analysis Phase 1, Issue #132). api-key가 비어 있으면
    # OpenAiAnalysisProvider.isConfigured()가 false를 반환해 분석 요청이 즉시 FAILED로 기록되고,
    # 애플리케이션 기동과 공고 게시 API는 그대로 정상 동작한다(Fail-Fast 아님, Collector/Discord
    # Bot과 동일한 방식). model 기본값은 값이 없을 때도 기동이 깨지지 않도록 하는 최소 Fallback일
    # 뿐 실제 운영 값을 의미하지 않는다 -- 실제 운영 값은 OPENAI_MODEL로 주입한다.
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
  program:
    close-scheduler:
      # 신청 종료 시각이 지난 PUBLISHED Program을 CLOSED로 전이하는 주기(ms, 원본 요구사항
      # 문서 8절, Phase 7). DiscordDeliveryWorker(sweep-interval-ms)와 동일한 60초 기본값 --
      # 최소 자동 재시도 백오프(1분)보다 촘촘하게 돌 이유가 없다.
      interval-ms: 60000
  recommendation:
    generation-scheduler:
      # 일일 추천 생성 실행 시각이다(Recommendation R4, Issue #160). GETI Notion/Figma/기존
      # 문서 어디에도 확정 값이 없어(DECISION_REQUIRED, PR 본문 참고) 근거 없는 시각을 넣지
      # 않는다. 기본값 "-"는 Spring @Scheduled의 비활성 Sentinel(CronExpression.DISABLED)이라
      # 이 값을 그대로 두면 RecommendationGenerationScheduler.generateDailyRecommendations()
      # 자체가 등록되지 않아 자동 실행되지 않는다 -- 운영자가 실제 값을 확정해 환경 변수로
      # 명시적으로 설정해야만 켜진다(CollectorScheduler의 external-enabled 기본 false와 같은
      # 안전 기본값 원칙).
      cron: ${RECOMMENDATION_GENERATION_SCHEDULER_CRON:-}
      # 회원 1명당 저장할 일일 추천 개수(Top N)다. 이 값도 확정 근거가 없다(DECISION_REQUIRED,
      # Issue #152 PR 본문에서도 R3 범위 밖으로 명시됐다). 조회 API 기본 Page 크기(size=20)와
      # 같은 잠정값을 둔다(docs/file/file-domain-plan.md의 "잠정값" 문서화 관례와 동일).
      top-n: ${RECOMMENDATION_GENERATION_TOP_N:20}
    similarity:
      # SIMILAR_JOBS 유사 공고 판정 Threshold다(R6, Issue #167 DECISION_REQUIRED 확정). 두 공고의
      # requiredTechStackIds/preferredTechStackIds를 합친 Set의 Jaccard Similarity가 이 값 이상이면
      # 유사 공고로 판정한다(RecommendationSimilarityEvaluator.isSimilarJob). Magic Number로 두지
      # 않고 이 값으로 분리했다(top-n/cron과 같은 관례) -- Default 0.6은 근거 없는 잠정값이 아니라
      # Issue #167에서 실제로 확정된 값이다.
      tech-stack-threshold: ${RECOMMENDATION_SIMILARITY_TECH_STACK_THRESHOLD:0.6}
  notification:
    # 인앱 알림 보관·정리 정책이다(Issue #194 확정 계약). domain.audit의 Audit Log Retention과는
    # 별개의 설정 Namespace다 -- 같은 Key로 묶지 않는다(NotificationRetentionProperties 참고).
    retention:
      # Soft Delete(deletedAt IS NOT NULL)된 알림을 deletedAt 기준 며칠 뒤 Hard Delete할지다.
      soft-deleted-retention-days: ${NOTIFICATION_RETENTION_SOFT_DELETED_DAYS:30}
      # 읽은 알림(isRead=true, 아직 Soft Delete 안 됨)을 readAt 기준 며칠 뒤 Hard Delete할지다
      # (NotificationRetentionCleanupServiceImpl의 "readAt vs createdAt" 판단 근거 참고).
      read-retention-days: ${NOTIFICATION_RETENTION_READ_DAYS:180}
      # 읽지 않은 알림(isRead=false, 아직 Soft Delete 안 됨)을 createdAt 기준 며칠 뒤 Hard
      # Delete할지다.
      unread-retention-days: ${NOTIFICATION_RETENTION_UNREAD_DAYS:365}
      # 한 번의 Scheduler 실행에서 정책별로 Hard Delete할 최대 건수다. 대량 DELETE로 Lock을 오래
      # 잡지 않기 위한 상한이며, 상한을 넘는 나머지는 다음 실행에서 이어서 처리된다.
      batch-size: ${NOTIFICATION_RETENTION_BATCH_SIZE:500}
      # Scheduler 실행 주기(ms). Hard Delete는 되돌릴 수 없어 촘촘하게 돌 필요가 없다(기본 1시간).
      scheduler-interval-ms: ${NOTIFICATION_RETENTION_SCHEDULER_INTERVAL_MS:3600000}
  collector:
    scheduler:
      # 일일 수집 실행 시각(초 분 시 일 월 요일). 매일 03:00에 실행한다(Issue #62).
      cron: "0 0 3 * * *"
      # 기본은 항상 꺼져 있다. 실제 서버에서 자동 외부 호출을 명시적으로 켜야만 동작한다.
      external-enabled: ${COLLECTOR_EXTERNAL_SCHEDULER_ENABLED:false}
    # 화면 검증용 개발 Fixture 자동 적재 여부(CollectorDevSeedRunner). 기본은 꺼져 있고
    # application-develop.yaml만 기본값을 true로 재정의한다. prod/production Profile에서
    # true로 켜면 애플리케이션이 기동을 거부한다(CollectorSeedProdGuard).
    seed:
      enabled: ${COLLECTOR_SEED_ENABLED:false}
    provider:
      mma:
        enabled: ${COLLECTOR_MMA_ENABLED:false}
        service-key: ${COLLECTOR_MMA_SERVICE_KEY:}
      job-alio:
        enabled: ${COLLECTOR_JOB_ALIO_ENABLED:false}
        service-key: ${COLLECTOR_JOB_ALIO_SERVICE_KEY:}
      clean-eye:
        enabled: ${COLLECTOR_CLEAN_EYE_ENABLED:false}
        service-key: ${COLLECTOR_CLEAN_EYE_SERVICE_KEY:}
      nara-ilteo:
        enabled: ${COLLECTOR_NARA_ILTEO_ENABLED:false}
        service-key: ${COLLECTOR_NARA_ILTEO_SERVICE_KEY:}
  discord:
    # Collector가 실제 Provider 수집으로 새로 등록(CREATED)한 공고에 대해서만 보내는 알림이다
    # (Issue #62 확장 범위). enabled가 false거나 webhook-url이 비어 있으면 애플리케이션·Collector·
    # 공고 등록은 그대로 정상 동작하고 알림만 비활성 상태로 유지된다(Fail-Fast 아님). CD/기존
    # 배포 알림(DISCORD_CD_WEBHOOK_URL)과는 별개의 Secret이다 — 절대 같은 값으로 가정하지 않는다.
    job-notification:
      enabled: ${DISCORD_JOB_NOTIFICATION_ENABLED:false}
      webhook-url: ${DISCORD_JOB_WEBHOOK_URL:}
      # 첫 전체 수집(해당 Provider의 최초 성공 Run)에서도 공고별로 개별 알림을 보낼지 여부.
      # 기본 false — 최초 수집은 수백 건일 수 있어 Discord Rate Limit/스팸을 피한다.
      notify-initial-import: ${DISCORD_JOB_NOTIFY_INITIAL_IMPORT:false}
      # 재시도 대기 중인 Delivery를 다시 살펴보는 주기(ms). 기본 5분.
      retry-interval-ms: 300000
    # Job/Program/Inquiry 업무 알림을 별도 서비스 GETI-Bot-V1의 Internal REST API로 보내는
    # 설정이다(docs/notification/discord-delivery-plan.md). 위 job-notification(수집 공고용
    # Discord Webhook)과는 전달 방식도 Secret도 완전히 별개다 — 절대 같은 값으로 가정하지 않는다.
    #
    # base-url이나 internal-api-key가 비어 있으면 Worker가 즉시 반환하고 Delivery는 PENDING으로
    # 쌓인다. 애플리케이션 기동과 공고/프로그램/문의 등록 API는 그대로 정상 동작한다(Fail-Fast
    # 아님). Secret에는 안전하지 않은 기본값을 주지 않는다.
    bot:
      enabled: ${DISCORD_BOT_ENABLED:false}
      base-url: ${DISCORD_BOT_BASE_URL:}
      internal-api-key: ${DISCORD_BOT_INTERNAL_API_KEY:}
      connect-timeout-ms: 2000
      # Bot 자체 Command Timeout(10초)보다 길게 잡아, Bot이 판단한 retryable을 받아 쓴다.
      # 짧게 잡으면 Bot이 실제로 게시했는데 서버만 실패로 처리하는 구간이 생긴다.
      read-timeout-ms: 12000
      # 자동 재시도 최소 백오프가 1분이라 그보다 촘촘하게 돌 이유가 없다.
      sweep-interval-ms: 60000
      # 이 시간을 넘도록 PROCESSING에 머문 Delivery를 재시도 대기로 되돌린다.
      stale-processing-threshold-ms: 300000
      max-automatic-retry-count: 3
      max-manual-retry-count: 3
      batch-size: 50
    # 학교 Discord 서버의 허용 채널과 학년별 Mention Role이다
    # (docs/notification/discord-event-wiring-plan.md §5.1). 위 bot(Bot Internal API 접속 설정)과
    # 달리 "어디에 보낼지"만 정하며, domain.job/domain.program(등록 요청이 지정한 채널 검증)과
    # domain.notification(Delivery 생성 시 최종 채널·Role 결정)이 함께 읽는다.
    #
    # 허용 채널의 실제 Snowflake는 아직 확정되지 않아 값을 비워 둔다(요구사항 §10 "코드 상수로
    # 임의 지정하지 않는다"). 값이 비어 있으면 Delivery를 만들지 않고 경고 로그만 남긴다 —
    # 기동과 공고·프로그램·문의 등록 API는 그대로 정상 동작한다(Fail-Fast 아님). 채널 Key 자체는
    # Secret이 아니라 이 파일에서 확정하고, Snowflake만 환경변수로 주입한다. 값이 정해지면
    # 환경변수만 채우면 되고 코드 수정·재배포가 필요 없다.
    channel-policy:
      channels:
        job-notice:
          channel-id: ${DISCORD_CHANNEL_JOB_NOTICE:}
          display-name: 공고 공지
        program-notice:
          channel-id: ${DISCORD_CHANNEL_PROGRAM_NOTICE:}
          display-name: 프로그램 공지
        inquiry-alert:
          channel-id: ${DISCORD_CHANNEL_INQUIRY_ALERT:}
          display-name: 문의 접수 알림
      # 학년 → Mention Role. 최초 성공 CREATE 한 번만 사용된다(요구사항 §24).
      grade-roles:
        "1": ${DISCORD_ROLE_GRADE_1:}
        "2": ${DISCORD_ROLE_GRADE_2:}
        "3": ${DISCORD_ROLE_GRADE_3:}
      # 등록 요청이 discordChannelKey를 생략한 공고가 쓰는 채널이다.
      default-job-channel-key: job-notice
      # 프로그램은 등록 요청이 원시 Snowflake(discordChannelId)를 직접 지정하므로 현재 이 기본값을
      # 읽는 경로가 없다. 채널 미지정 등록을 허용하게 되면 그때 사용한다.
      default-program-channel-key: program-notice
      # 문의 접수 알림은 사용자가 채널을 선택하지 않고 이 Key로 고정된다(요구사항 §9).
      inquiry-channel-key: inquiry-alert
  # 모바일 Push Provider 연동 설정이다(Issue #190). FCM HTTP v1 API 하나로 iOS/Android를 모두
  # 처리한다(별도 APNs 직접 연동 없음, PushProvider KDoc 참고).
  push:
    fcm:
      # service-account-key가 비어 있으면 isConfigured()가 false를 반환해 애플리케이션 기동과
      # 알림 생성 API는 그대로 정상 동작하고 Push만 PENDING으로 쌓인다(Fail-Fast 아님, Discord
      # Bot과 같은 방식). Secret에는 안전하지 않은 기본값을 주지 않는다.
      enabled: ${PUSH_FCM_ENABLED:false}
      # Google Service Account JSON Key 문서 전체(project_id/client_email/private_key 포함)를
      # 그대로 담은 값이다. 절대 이 파일이나 Test Fixture에 실제 값을 적지 않는다.
      service-account-key: ${PUSH_FCM_SERVICE_ACCOUNT_KEY:}
      connect-timeout-ms: 3000
      read-timeout-ms: 8000
    delivery:
      # Push는 사용자에게 실시간에 가깝게 도착해야 하는 알림이라 Discord Bot Worker(60초)보다
      # 촘촘히 돈다(PushDeliveryRetryPolicy의 첫 백오프 30초와 어울리는 주기).
      sweep-interval-ms: 15000
      stale-processing-threshold-ms: 120000
      # 자동 재시도 최대 횟수(Issue #190 확정 계약: 기본 최대 3회).
      max-retry-count: 3
      batch-size: 100
  # /actuator/info의 "deployment" 필드(DeploymentInfoContributor)가 사용하는 배포 메타데이터다.
  # CD가 Docker Build/Runtime 시점에 APP_VERSION/APP_GIT_SHA/APP_BUILD_TIME/APP_ENVIRONMENT를
  # 주입한다(docs/development/cd.md 참고). version의 "0.0.1-SNAPSHOT" 기본값은 build.gradle.kts의
  # 현재 project.version과 같은 값이며, 값이 없는 로컬 실행에서도 기동이 깨지지 않도록 한다.
  deployment:
    service: GETI-Server
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    git-sha: ${APP_GIT_SHA:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
    environment: ${APP_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness는 Process 생존 여부만 본다(PostgreSQL/Redis 등 외부 의존성 제외). Readiness는
        # GETI 서버 운영에 필수적인 PostgreSQL(db)과 Redis만 검사 대상에 포함한다(Collector 외부
        # API, Discord Webhook, MinIO Application Client는 포함하지 않음, docs/development/web-api.md의
        # "Actuator / Health" 참고). Contributor 이름(livenessState/readinessState/db/redis)은 실제
        # HealthContributorRegistry로 확인했다.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

# Swagger UI/OpenAPI JSON은 기본적으로 활성화한다(local, prod 이외 Profile 포함). Production에서는
# application-prod.yaml이 false로 재정의해 운영 환경에 노출하지 않는다(docs/ai/openapi-documentation.md 참고).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
