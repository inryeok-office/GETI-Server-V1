spring:
  application:
    name: GETI-Server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      # 미설정으로 두면 Spring 기본값이 1MB라 사실상 모든 업로드가 막힌다. 아래 app.file.policies의
      # 어떤 max-size-bytes보다도 커야 하며, FilePolicyMultipartGuard가 기동 시점에 검증한다.
      max-file-size: 20MB
      max-request-size: 25MB
  profiles:
    # develop Profile은 local의 PostgreSQL/Redis/JWT 등 Infra 기본값을 그대로 재사용하고
    # Collector Seed 기본값만 다르게 둔다(Issue #62, docs/development/cd.md). Profile Group을
    # 활성화하면 develop과 local이 함께 활성화되어 application-local.yaml도 적용된다.
    group:
      develop: local

# JWT Access/Refresh Token 만료 시간(초). Secret은 Profile별 실제 값이 필요해 여기(공통 설정)에는
# 두지 않고 application-local.yaml/application-prod.yaml에서만 정의한다(datasource 설정과 동일한 방식).
#
# app.oauth.google.*는 의도적으로 spring.security.oauth2.client.registration.* 이름을 쓰지 않는다.
# 그 이름을 쓰면 client-id가 비어 있어도 Spring Boot OAuth2 Client 자동 설정이 시작 시점에
# ClientRegistration을 만들려다 실패해 App 기동 자체가 막힌다(Google 미설정 상태에서도 App은
# 정상 기동해야 하므로). ClientRegistration은 OAuthLoginServiceImpl이 이 값으로 직접 만든다.
app:
  # 목적별 업로드 정책이다(File 도메인 요구사항 §7, Issue #85).
  #
  # 아래 확장자·MIME·크기·개수는 모두 **잠정값**이다. GETI Notion에 확정된 숫자가 없어
  # docs/file/file-domain-plan.md §17에 DECISION_REQUIRED로 남겼다. 값이 확정되면 이 설정만
  # 교체하면 되고 코드 변경·재배포가 필요 없다.
  #
  # SVG는 어떤 목적에서도 허용하지 않는다 — 스크립트를 품을 수 있어 다운로드 시 attachment로
  # 강등되는데, 로고·프로필처럼 화면에 표시해야 하는 용도와 모순되기 때문이다(§27/§28).
  file:
    policies:
      PROFILE_IMAGE:
        extensions: [png, jpg, jpeg, webp]
        mime-types: [image/png, image/jpeg, image/webp]
        max-size-bytes: 5242880       # 5MB
        max-count: 1
      COMPANY_LOGO:
        extensions: [png, jpg, jpeg, webp]
        mime-types: [image/png, image/jpeg, image/webp]
        max-size-bytes: 2097152       # 2MB
        max-count: 1
      JOB_ATTACHMENT:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      PROGRAM_ATTACHMENT:
        extensions: [pdf, png, jpg, jpeg]
        mime-types: [application/pdf, image/png, image/jpeg]
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      JOB_APPLICATION:
        extensions: [pdf, docx, png, jpg, jpeg]
        mime-types:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - image/png
          - image/jpeg
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      PROGRAM_APPLICATION:
        extensions: [pdf, docx, png, jpg, jpeg]
        mime-types:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - image/png
          - image/jpeg
        max-size-bytes: 10485760      # 10MB
        max-count: 5
      INQUIRY_ATTACHMENT:
        extensions: [png, jpg, jpeg, pdf]
        mime-types: [image/png, image/jpeg, application/pdf]
        max-size-bytes: 5242880       # 5MB
        max-count: 3
      PORTFOLIO:
        extensions: [pdf, docx, png, jpg, jpeg]
        mime-types:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - image/png
          - image/jpeg
        max-size-bytes: 20971520      # 20MB
        max-count: 5
  jwt:
    access-token-expiration-seconds: 1800
    refresh-token-expiration-seconds: 1209600
  oauth:
    google:
      scope: openid,email,profile
  collector:
    scheduler:
      # 일일 수집 실행 시각(초 분 시 일 월 요일). 매일 03:00에 실행한다(Issue #62).
      cron: "0 0 3 * * *"
      # 기본은 항상 꺼져 있다. 실제 서버에서 자동 외부 호출을 명시적으로 켜야만 동작한다.
      external-enabled: ${COLLECTOR_EXTERNAL_SCHEDULER_ENABLED:false}
    # 화면 검증용 개발 Fixture 자동 적재 여부(CollectorDevSeedRunner). 기본은 꺼져 있고
    # application-develop.yaml만 기본값을 true로 재정의한다. prod/production Profile에서
    # true로 켜면 애플리케이션이 기동을 거부한다(CollectorSeedProdGuard).
    seed:
      enabled: ${COLLECTOR_SEED_ENABLED:false}
    provider:
      mma:
        enabled: ${COLLECTOR_MMA_ENABLED:false}
        service-key: ${COLLECTOR_MMA_SERVICE_KEY:}
      job-alio:
        enabled: ${COLLECTOR_JOB_ALIO_ENABLED:false}
        service-key: ${COLLECTOR_JOB_ALIO_SERVICE_KEY:}
      clean-eye:
        enabled: ${COLLECTOR_CLEAN_EYE_ENABLED:false}
        service-key: ${COLLECTOR_CLEAN_EYE_SERVICE_KEY:}
      nara-ilteo:
        enabled: ${COLLECTOR_NARA_ILTEO_ENABLED:false}
        service-key: ${COLLECTOR_NARA_ILTEO_SERVICE_KEY:}
  discord:
    # Collector가 실제 Provider 수집으로 새로 등록(CREATED)한 공고에 대해서만 보내는 알림이다
    # (Issue #62 확장 범위). enabled가 false거나 webhook-url이 비어 있으면 애플리케이션·Collector·
    # 공고 등록은 그대로 정상 동작하고 알림만 비활성 상태로 유지된다(Fail-Fast 아님). CD/기존
    # 배포 알림(DISCORD_CD_WEBHOOK_URL)과는 별개의 Secret이다 — 절대 같은 값으로 가정하지 않는다.
    job-notification:
      enabled: ${DISCORD_JOB_NOTIFICATION_ENABLED:false}
      webhook-url: ${DISCORD_JOB_WEBHOOK_URL:}
      # 첫 전체 수집(해당 Provider의 최초 성공 Run)에서도 공고별로 개별 알림을 보낼지 여부.
      # 기본 false — 최초 수집은 수백 건일 수 있어 Discord Rate Limit/스팸을 피한다.
      notify-initial-import: ${DISCORD_JOB_NOTIFY_INITIAL_IMPORT:false}
      # 재시도 대기 중인 Delivery를 다시 살펴보는 주기(ms). 기본 5분.
      retry-interval-ms: 300000
  # /actuator/info의 "deployment" 필드(DeploymentInfoContributor)가 사용하는 배포 메타데이터다.
  # CD가 Docker Build/Runtime 시점에 APP_VERSION/APP_GIT_SHA/APP_BUILD_TIME/APP_ENVIRONMENT를
  # 주입한다(docs/development/cd.md 참고). version의 "0.0.1-SNAPSHOT" 기본값은 build.gradle.kts의
  # 현재 project.version과 같은 값이며, 값이 없는 로컬 실행에서도 기동이 깨지지 않도록 한다.
  deployment:
    service: GETI-Server
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    git-sha: ${APP_GIT_SHA:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
    environment: ${APP_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness는 Process 생존 여부만 본다(PostgreSQL/Redis 등 외부 의존성 제외). Readiness는
        # GETI 서버 운영에 필수적인 PostgreSQL(db)과 Redis만 검사 대상에 포함한다(Collector 외부
        # API, Discord Webhook, MinIO Application Client는 포함하지 않음, docs/development/web-api.md의
        # "Actuator / Health" 참고). Contributor 이름(livenessState/readinessState/db/redis)은 실제
        # HealthContributorRegistry로 확인했다.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

# Swagger UI/OpenAPI JSON은 기본적으로 활성화한다(local, prod 이외 Profile 포함). Production에서는
# application-prod.yaml이 false로 재정의해 운영 환경에 노출하지 않는다(docs/ai/openapi-documentation.md 참고).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
