name: (임시) Discord Job Webhook 등록 테스트

# DISCORD_JOB_WEBHOOK_URL GitHub Secret이 실제로 유효한지 1회성으로 확인하기 위한 임시 Workflow다.
# Collector 신규 공고 알림 기능(Issue #62 확장 범위) 자체는 이 Workflow를 사용하지 않는다 — 검증이
# 끝나면 이 파일은 삭제한다.
on:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 Embed 전송
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_JOB_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_JOB_WEBHOOK_URL Secret이 등록되어 있지 않습니다."
            exit 1
          fi

          jq -n \
            --argjson color 16705372 \
            '{
              embeds: [
                {
                  title: "GETI Collector Webhook 등록 테스트",
                  description: "DISCORD_JOB_WEBHOOK_URL Secret이 정상적으로 등록되었는지 확인하는 1회성 테스트 메시지입니다.",
                  color: $color,
                  footer: { text: "GETI Collector" }
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          jq empty /tmp/discord-payload.json

          http_status=$(curl \
            --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          echo "HTTP status: ${http_status}"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Discord 테스트 알림 전송에 실패했습니다(HTTP ${http_status})."
            exit 1
          fi

          echo "Discord 테스트 알림 전송 성공(HTTP ${http_status})."
