name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "25"

jobs:
  wrapper-validation:
    name: Wrapper Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  quality:
    name: Quality
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # detekt는 compileKotlin 산출물에 의존하지 않지만, Compile 실패를 가장 먼저
      # 확인하기 위해 명시적으로 함께 실행한다.
      - name: Compile and run Spotless / detekt
        run: ./gradlew compileKotlin compileTestKotlin spotlessCheck detekt

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Quality"
            echo "- 실행 Task: \`compileKotlin compileTestKotlin spotlessCheck detekt\`"
            echo "- detekt Report Artifact: \`detekt-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-test:
    name: Unit Test
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # test는 Docker 없이 실행된다(src/test는 PostgreSQL/Redis에 의존하지 않는다).
      # Spring Modulith 구조 검증(ModularityTest)과 Web Slice/Configuration Test도
      # 이 일반 test Task에 포함되어 함께 실행된다.
      - name: Run Unit Test and Coverage Report
        run: ./gradlew test koverHtmlReport koverXmlReport

      - name: Upload Unit Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/reports/kover/html/
            build/reports/kover/report.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Unit Test"
            echo "- 실행 Task: \`test koverHtmlReport koverXmlReport\`"
            echo "- 포함 검증: Unit Test, Web Slice Test, Configuration Test, Spring Modulith 구조 검증(ModularityTest)"
            echo "- Test Report Artifact: \`unit-test-report\`, Coverage Artifact: \`coverage-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Integration Test
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # GitHub-hosted ubuntu-latest Runner는 Docker Daemon을 기본 제공한다.
      # Testcontainers(PostgreSQL, Redis)가 이를 자동으로 사용하므로 별도
      # Docker Socket 설정이나 Ryuk 비활성화 같은 Workaround를 추가하지 않는다.
      - name: Run Integration Test (Testcontainers)
        run: ./gradlew integrationTest

      - name: Upload Integration Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Integration Test"
            echo "- 실행 Task: \`integrationTest\`"
            echo "- 포함 검증: PostgreSQL/Redis Testcontainers, Flyway, JPA"
            echo "- Test Report Artifact: \`integration-test-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs:
      - wrapper-validation
      - quality
      - unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # quality/unit-test Job에서 이미 Spotless/detekt/Unit Test를 실행했지만,
      # 이 Repository의 표준 최종 검증 명령(clean test build, docs/AGENTS.md 등에서
      # 반복 사용)과 동일하게 유지해 로컬 재현성을 우선한다. needs로 앞선 Job이
      # 먼저 실패하면 이 Job 자체가 실행되지 않아 중복 비용은 제한적이다.
      - name: Gradle Build
        run: ./gradlew build

      - name: Upload Build Jars
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-jars
          path: build/libs/*.jar
          retention-days: 7
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Build"
            echo "- 실행 Task: \`build\` (spotlessCheck/detekt/test/koverVerify 포함)"
            echo "- Jar Artifact: \`build-jars\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-validation:
    name: Docker Validation
    needs:
      - wrapper-validation
      - quality
      - unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      # Registry Login과 Image Push는 수행하지 않는다. Build 성공 여부만 검증한다.
      - name: Build Spring Boot Docker image
        run: docker build -t geti-server-app:ci .

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Docker Validation"
            echo "- \`docker compose config\`, \`docker build\`(Registry Push 없음)"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-discord:
    name: Notify Discord
    needs:
      - wrapper-validation
      - quality
      - unit-test
      - integration-test
      - build
      - docker-validation
    # 선행 Job의 성공/실패/Skip과 관계없이 완료 결과를 항상 알려야 하므로 always()를
    # 사용한다. 이 Job은 Required Status Check가 아니며(docs/development/ci.md 참고),
    # 알림 성공/실패가 CI의 필수 결과에 영향을 주지 않는다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine overall CI result
        id: overall
        env:
          WRAPPER_VALIDATION_RESULT: ${{ needs.wrapper-validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_VALIDATION_RESULT: ${{ needs.docker-validation.result }}
        run: |
          set -Eeuo pipefail
          results="$WRAPPER_VALIDATION_RESULT $QUALITY_RESULT $UNIT_TEST_RESULT $INTEGRATION_TEST_RESULT $BUILD_RESULT $DOCKER_VALIDATION_RESULT"

          if grep -qw "failure" <<< "$results"; then
            overall="failure"
          elif grep -qw "cancelled" <<< "$results"; then
            overall="cancelled"
          elif grep -qw "skipped" <<< "$results"; then
            overall="skipped"
          else
            overall="success"
          fi

          echo "result=$overall" >> "$GITHUB_OUTPUT"

      - name: Resolve Pull Request info
        id: pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -Eeuo pipefail
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # Webhook 전송 없이도 Payload만 단위로 검증할 수 있도록 생성과 전송 Step을
      # 분리한다. 이 Step은 Secret을 전혀 참조하지 않는다.
      - name: Build Discord payload
        id: payload
        env:
          OVERALL_RESULT: ${{ steps.overall.outputs.result }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          # pull_request Event에서는 github.ref_name이 PR Merge Ref(예: 123/merge)이므로
          # 실제 Source Branch 이름은 head_ref를 우선 사용한다.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          WRAPPER_VALIDATION_RESULT: ${{ needs.wrapper-validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_VALIDATION_RESULT: ${{ needs.docker-validation.result }}
        run: |
          set -Eeuo pipefail

          SHORT_SHA="${COMMIT_SHA:0:7}"

          case "$OVERALL_RESULT" in
            success)   TITLE="✅ CI 성공"; COLOR=3066993 ;;
            failure)   TITLE="❌ CI 실패"; COLOR=15158332 ;;
            cancelled) TITLE="⚠️ CI 취소"; COLOR=15105570 ;;
            *)         TITLE="ℹ️ CI 일부 건너뜀"; COLOR=16776960 ;;
          esac

          fields=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg event "$EVENT_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg overall "$OVERALL_RESULT" \
            --arg wrapper "$WRAPPER_VALIDATION_RESULT" \
            --arg quality "$QUALITY_RESULT" \
            --arg unitTest "$UNIT_TEST_RESULT" \
            --arg integrationTest "$INTEGRATION_TEST_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg docker "$DOCKER_VALIDATION_RESULT" \
            '[
              {name: "Repository", value: $repo, inline: true},
              {name: "Event", value: $event, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $commit, inline: true},
              {name: "Actor", value: $actor, inline: true},
              {name: "Overall Result", value: $overall, inline: true},
              {name: "Wrapper Validation", value: $wrapper, inline: true},
              {name: "Quality", value: $quality, inline: true},
              {name: "Unit Test", value: $unitTest, inline: true},
              {name: "Integration Test", value: $integrationTest, inline: true},
              {name: "Build", value: $build, inline: true},
              {name: "Docker Validation", value: $docker, inline: true}
            ]')

          if [ -n "${PR_NUMBER:-}" ]; then
            fields=$(jq --arg num "$PR_NUMBER" --arg url "$PR_URL" \
              '. + [{name: "Pull Request", value: ("#" + $num + " " + $url), inline: false}]' \
              <<< "$fields")
          fi

          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --argjson fields "$fields" \
            --arg runUrl "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            '{
              embeds: [
                {
                  title: $title,
                  description: ($workflow + " Workflow 실행 결과"),
                  color: $color,
                  fields: $fields,
                  url: $runUrl
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          # 생성된 Payload가 유효한 JSON인지만 확인한다(Secret이 없어도 검증 가능).
          jq empty /tmp/discord-payload.json

      # Webhook URL은 이 Step의 Environment Variable로만 존재하며 Log, echo, set -x
      # 어디에도 출력하지 않는다. Secret이 없으면(Fork PR, Dependabot PR, 미등록)
      # 안전하게 Skip하고 Job 자체를 실패시키지 않는다.
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          OVERALL_RESULT: ${{ steps.overall.outputs.result }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::notice::Discord CI notification skipped because DISCORD_CI_WEBHOOK_URL is unavailable."
            {
              echo "### Discord 알림"
              echo "- 결과: Skip (\`DISCORD_CI_WEBHOOK_URL\` Secret 없음 — Fork PR/Dependabot PR 또는 미등록)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          http_status=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord-response.json \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            --request POST \
            --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::Discord CI notification failed (HTTP status: ${http_status})."
            {
              echo "### Discord 알림"
              echo "- 결과: 전송 실패 (HTTP ${http_status})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Discord 알림"
            echo "- 결과: 전송 성공 (Overall: ${OVERALL_RESULT})"
          } >> "$GITHUB_STEP_SUMMARY"
