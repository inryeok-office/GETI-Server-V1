name: (임시) Collection Run 요약 알림 실물 테스트

# DiscordCollectionRunEmbedBuilder가 실제로 만드는 Payload와 동일한 구조로 예시 Embed 2종
# (성공/부분 실패)을 실제 Discord Webhook에 전송해 형식을 확인하기 위한 1회성 Workflow다.
# 검증이 끝나면 이 파일은 삭제한다.
on:
  push:
    branches: [feature/62-collector-core]
    paths:
      - .github/workflows/_tmp-test-collection-run-embed.yml

jobs:
  test:
    name: 예시 Collection Run 요약 Embed 전송
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send sample embeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_JOB_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_JOB_WEBHOOK_URL Secret이 없습니다."
            exit 1
          fi

          send() {
            local payload_file="$1"
            local label="$2"
            http_status=$(curl \
              --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
              --connect-timeout 10 --max-time 20 \
              --request POST --header "Content-Type: application/json" \
              --data @"$payload_file" \
              "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"
            echo "[$label] HTTP status: ${http_status}"
            if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
              echo "::error::[$label] 전송 실패"
              cat /tmp/discord-response.json || true
              exit 1
            fi
          }

          # 성공 예시(DiscordCollectionRunEmbedBuilder가 CollectionRunStatus.SUCCESS일 때 만드는 것과 동일한 구조)
          jq -n \
            --argjson color 3066993 \
            '{
              embeds: [
                {
                  title: "✅ [병역일터(산업기능요원·전문연구요원)] 수집 실행 성공",
                  description: "Collector 수집 실행이 종료되었습니다.",
                  color: $color,
                  fields: [
                    {name: "실행 유형", value: "SYNC", inline: true},
                    {name: "결과", value: "성공", inline: true},
                    {name: "시작 일시", value: "2026-08-04 03:00:00", inline: true},
                    {name: "종료 일시", value: "2026-08-04 03:02:17", inline: true},
                    {name: "소요 시간", value: "2분 17초", inline: true},
                    {name: "전체 공고 수", value: "42", inline: true},
                    {name: "성공", value: "40", inline: true},
                    {name: "실패", value: "2", inline: true},
                    {name: "품질 경고", value: "5", inline: true},
                    {name: "Run ID", value: "123", inline: true}
                  ],
                  footer: {text: "GETI Collector"},
                  timestamp: "2026-08-04T03:02:17+09:00"
                }
              ],
              allowed_mentions: {parse: []}
            }' > /tmp/sample-success.json
          jq empty /tmp/sample-success.json
          send /tmp/sample-success.json "성공 예시"

          # 실패 예시(CollectionRunStatus.FAILED, Provider 인증 실패 등으로 전체 실행 자체가 실패한 경우)
          jq -n \
            --argjson color 15158332 \
            '{
              embeds: [
                {
                  title: "❌ [병역일터(산업기능요원·전문연구요원)] 수집 실행 실패",
                  description: "Collector 수집 실행이 종료되었습니다.",
                  color: $color,
                  fields: [
                    {name: "실행 유형", value: "SYNC", inline: true},
                    {name: "결과", value: "실패", inline: true},
                    {name: "시작 일시", value: "2026-08-04 03:00:00", inline: true},
                    {name: "종료 일시", value: "2026-08-04 03:00:04", inline: true},
                    {name: "소요 시간", value: "4초", inline: true},
                    {name: "전체 공고 수", value: "1", inline: true},
                    {name: "성공", value: "0", inline: true},
                    {name: "실패", value: "1", inline: true},
                    {name: "실패 사유", value: "MMA 인증 오류(resultCode=20)", inline: true},
                    {name: "Run ID", value: "124", inline: true}
                  ],
                  footer: {text: "GETI Collector"},
                  timestamp: "2026-08-04T03:00:04+09:00"
                }
              ],
              allowed_mentions: {parse: []}
            }' > /tmp/sample-failure.json
          jq empty /tmp/sample-failure.json
          send /tmp/sample-failure.json "실패 예시"

          echo "두 예시 Embed 전송 성공"
