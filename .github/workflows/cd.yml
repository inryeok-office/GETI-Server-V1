name: CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

# 연속된 develop Push가 EC2에서 동시에 git reset/docker build를 실행해 서로 간섭하지 않도록
# 한 번에 하나씩만 배포한다. 진행 중인 배포를 새 Push가 임의로 취소하면 Container가 절반만
# Build된 상태로 남을 수 있어 cancel-in-progress는 사용하지 않는다(순서대로 대기).
concurrency:
  group: cd-deploy-develop
  cancel-in-progress: false

jobs:
  notify-start:
    name: Discord 배포 시작 알림
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build Discord payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fields=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg env "develop" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            '[
              {name: "Repository", value: $repo, inline: true},
              {name: "Environment", value: $env, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $commit, inline: true},
              {name: "Actor", value: $actor, inline: true},
              {name: "Workflow", value: $workflow, inline: true},
              {name: "Status", value: "started", inline: true}
            ]')

          jq -n \
            --arg title "🚀 CD 배포 시작" \
            --argjson color 3447003 \
            --argjson fields "$fields" \
            --arg runUrl "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  description: ($workflow + " 배포를 시작합니다"),
                  color: $color,
                  fields: $fields,
                  url: $runUrl,
                  timestamp: $timestamp
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          jq empty /tmp/discord-payload.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::notice::Discord CD 시작 알림을 Skip합니다(DISCORD_CD_WEBHOOK_URL Secret 없음)."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: Skip (\`DISCORD_CD_WEBHOOK_URL\` Secret 없음)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          http_status=$(curl \
            --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::Discord CD 시작 알림 전송에 실패했습니다(HTTP ${http_status})."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: 전송 실패 (HTTP ${http_status})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: 시작 알림 전송 성공" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 서버 배포
    needs: notify-start
    # 시작 알림 Job이 먼저 끝나기를 기다리기만 하고, 그 결과에는 의존하지 않는다. notify-start가
    # (Discord 전송이 아니라 Job 자체가) 실패해도 실제 배포는 항상 정상적으로 실행돼야 한다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Readiness Check와 배포 SHA 검증을 SSH 세션 안에서 모두 수행한다(서버에 jq/Python 등
      # 별도 도구가 있다고 가정하지 않기 위해, /actuator/info의 JSON을 직접 Parsing하지 않고
      # 실행 중인 Container의 APP_GIT_SHA 환경변수를 직접 읽어 배포 대상 SHA와 비교한다).
      # 배포 Metadata는 `sudo env VAR=value ...`처럼 sudo의 실행 대상을 docker가 아닌 다른
      # 명령으로 바꾸지 않고, docker compose가 원래 지원하는 `--build-arg`로만 전달한다 —
      # devops가 이미 구성해 둔 `sudo docker compose ...` 명령 자체(및 그 sudoers 권한)는
      # 그대로 유지된다. docs/development/cd.md 참고.
      - name: 서버 배포
        uses: appleboy/ssh-action@v1.2.5
        env:
          # appleboy/ssh-action의 envs 입력이 SSH 세션 시작 시 이 Job 환경의 값을 그대로
          # export한다. Secret 값 자체는 script 안에서 echo/log로 출력하지 않는다(GitHub
          # Actions가 Secret 값을 로그에서 자동 Mask하지만, 이중으로 노출을 피한다). CD 배포
          # 알림(DISCORD_CD_WEBHOOK_URL)과는 완전히 별개의 Secret이다.
          DISCORD_JOB_WEBHOOK_URL: ${{ secrets.DISCORD_JOB_WEBHOOK_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 25m
          envs: DISCORD_JOB_WEBHOOK_URL
          script: |
            set -e
            cd ~/GETI-Server
            git fetch origin develop
            git reset --hard origin/develop

            DEPLOY_SHA=$(git rev-parse HEAD)
            APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            APP_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')

            # Collector 신규 공고 Discord Webhook URL을 compose.yaml의 app.env_file(.env.collector-discord.local,
            # required: false)로만 전달한다. sudo docker compose 명령 자체(및 인자)는 바꾸지
            # 않는다 — env_file은 Compose가 파일 내용으로 Container 환경변수를 채우는 방식이라
            # sudoers가 docker 실행만 허용하는 서버에서도 안전하다. 값은 절대 echo하지 않는다.
            umask 077
            if [ -n "${DISCORD_JOB_WEBHOOK_URL:-}" ]; then
              printf 'DISCORD_JOB_WEBHOOK_URL=%s\n' "$DISCORD_JOB_WEBHOOK_URL" > .env.collector-discord.local
            else
              rm -f .env.collector-discord.local
            fi

            sudo docker compose build \
              --build-arg "APP_VERSION=${APP_VERSION}" \
              --build-arg "APP_GIT_SHA=${DEPLOY_SHA}" \
              --build-arg "APP_BUILD_TIME=${APP_BUILD_TIME}" \
              --build-arg "APP_ENVIRONMENT=develop" \
              app
            sudo docker compose --profile app up -d

            READY=false
            for i in $(seq 1 24); do
              sleep 5
              if sudo docker compose exec -T app wget -qO- http://localhost:8080/actuator/health/readiness 2>/dev/null; then
                echo "Readiness check passed"
                READY=true
                break
              fi
              echo "Waiting for app readiness... ($i/24)"
            done

            if [ "$READY" != "true" ]; then
              echo "Readiness check failed after waiting"
              sudo docker compose logs app --tail=50
              exit 1
            fi

            if ! sudo docker compose exec -T app wget -qO- http://localhost:8080/actuator/info 2>/dev/null; then
              echo "/actuator/info 호출에 실패했습니다"
              sudo docker compose logs app --tail=50
              exit 1
            fi

            RUNNING_SHA=$(sudo docker compose exec -T app printenv APP_GIT_SHA | tr -d '\r\n')

            if [ -z "$RUNNING_SHA" ] || [ "$RUNNING_SHA" = "unknown" ]; then
              echo "실행 중인 Container에서 APP_GIT_SHA를 확인할 수 없습니다."
              exit 1
            fi

            if [ "$RUNNING_SHA" != "$DEPLOY_SHA" ]; then
              echo "실행 중인 Container의 SHA(${RUNNING_SHA})가 배포 대상 SHA(${DEPLOY_SHA})와 일치하지 않습니다."
              exit 1
            fi

            echo "배포 검증 완료: SHA=${DEPLOY_SHA}"

  deploy-prod:
    name: 서버 배포 (prod)
    needs: [notify-start, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 서버 배포 (prod)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e
            cd ~/GETI-Server
            git fetch origin develop
            git reset --hard origin/develop

            DEPLOY_SHA=$(git rev-parse HEAD)
            APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            APP_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')

            sudo docker compose build \
              --build-arg "APP_VERSION=${APP_VERSION}" \
              --build-arg "APP_GIT_SHA=${DEPLOY_SHA}" \
              --build-arg "APP_BUILD_TIME=${APP_BUILD_TIME}" \
              --build-arg "APP_ENVIRONMENT=prod" \
              app-prod
            sudo docker compose --profile app-prod up -d

            READY=false
            for i in $(seq 1 24); do
              sleep 5
              if sudo docker compose exec -T app-prod wget -qO- http://localhost:8081/actuator/health/readiness 2>/dev/null; then
                echo "Readiness check passed (prod)"
                READY=true
                break
              fi
              echo "Waiting for app-prod readiness... ($i/24)"
            done

            if [ "$READY" != "true" ]; then
              echo "Readiness check failed after waiting (prod)"
              sudo docker compose logs app-prod --tail=50
              exit 1
            fi

            RUNNING_SHA=$(sudo docker compose exec -T app-prod printenv APP_GIT_SHA | tr -d '\r\n')

            if [ -z "$RUNNING_SHA" ] || [ "$RUNNING_SHA" = "unknown" ]; then
              echo "실행 중인 Container(prod)에서 APP_GIT_SHA를 확인할 수 없습니다."
              exit 1
            fi

            if [ "$RUNNING_SHA" != "$DEPLOY_SHA" ]; then
              echo "실행 중인 Container(prod)의 SHA(${RUNNING_SHA})가 배포 대상 SHA(${DEPLOY_SHA})와 일치하지 않습니다."
              exit 1
            fi

            echo "배포 검증 완료(prod): SHA=${DEPLOY_SHA}"

  notify-success:
    name: Discord 배포 성공 알림
    needs: [notify-start, deploy, deploy-prod]
    if: needs.deploy.result == 'success' && needs.deploy-prod.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build Discord payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fields=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg env "develop" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            '[
              {name: "Repository", value: $repo, inline: true},
              {name: "Environment", value: $env, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $commit, inline: true},
              {name: "Actor", value: $actor, inline: true},
              {name: "Workflow", value: $workflow, inline: true},
              {name: "Status", value: "success", inline: true},
              {name: "Readiness 결과", value: "✅ 통과", inline: true},
              {name: "Git SHA 검증 결과", value: "✅ 일치", inline: true}
            ]')

          jq -n \
            --arg title "✅ CD 배포 성공" \
            --argjson color 3066993 \
            --argjson fields "$fields" \
            --arg runUrl "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  description: ($workflow + " 배포가 완료됐습니다(Readiness/Git SHA 검증 통과)"),
                  color: $color,
                  fields: $fields,
                  url: $runUrl,
                  timestamp: $timestamp
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          jq empty /tmp/discord-payload.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::notice::Discord CD 성공 알림을 Skip합니다(DISCORD_CD_WEBHOOK_URL Secret 없음)."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: Skip (\`DISCORD_CD_WEBHOOK_URL\` Secret 없음)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          http_status=$(curl \
            --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::Discord CD 성공 알림 전송에 실패했습니다(HTTP ${http_status})."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: 전송 실패 (HTTP ${http_status})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: 성공 알림 전송 성공" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Discord 배포 실패 알림
    needs: [notify-start, deploy, deploy-prod]
    if: always() && (needs.deploy.result == 'failure' || needs.deploy-prod.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build Discord payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fields=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg env "develop" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            '[
              {name: "Repository", value: $repo, inline: true},
              {name: "Environment", value: $env, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $commit, inline: true},
              {name: "Actor", value: $actor, inline: true},
              {name: "Workflow", value: $workflow, inline: true},
              {name: "Status", value: "failure", inline: true},
              {
                name: "실패 사유",
                value: "서버 배포(Readiness Polling, Git SHA 검증, 또는 Container 실행) 중 하나가 실패했습니다. Workflow Log를 확인하세요.",
                inline: false
              }
            ]')

          jq -n \
            --arg title "❌ CD 배포 실패" \
            --argjson color 15158332 \
            --argjson fields "$fields" \
            --arg runUrl "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  description: ($workflow + " 배포에 실패했습니다"),
                  color: $color,
                  fields: $fields,
                  url: $runUrl,
                  timestamp: $timestamp
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          jq empty /tmp/discord-payload.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::notice::Discord CD 실패 알림을 Skip합니다(DISCORD_CD_WEBHOOK_URL Secret 없음)."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: Skip (\`DISCORD_CD_WEBHOOK_URL\` Secret 없음)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          http_status=$(curl \
            --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::Discord CD 실패 알림 전송에 실패했습니다(HTTP ${http_status})."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: 전송 실패 (HTTP ${http_status})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: 실패 알림 전송 성공" >> "$GITHUB_STEP_SUMMARY"

  notify-cancelled:
    name: Discord 배포 취소 알림
    needs: [notify-start, deploy, deploy-prod]
    # GitHub Actions가 Workflow Run 자체를 강제 취소하면 이 Job이 예약되지 않을 수 있어(대기 중인
    # Job까지 즉시 종료), 취소 알림은 Best Effort로만 보장한다(docs/development/cd.md 참고).
    if: always() && (cancelled() || needs.deploy.result == 'cancelled' || needs.deploy-prod.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build Discord payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fields=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg env "develop" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            '[
              {name: "Repository", value: $repo, inline: true},
              {name: "Environment", value: $env, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $commit, inline: true},
              {name: "Actor", value: $actor, inline: true},
              {name: "Workflow", value: $workflow, inline: true},
              {name: "Status", value: "cancelled", inline: true}
            ]')

          jq -n \
            --arg title "⚠️ CD 배포 취소" \
            --argjson color 15105570 \
            --argjson fields "$fields" \
            --arg runUrl "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  description: ($workflow + " 배포가 취소됐습니다"),
                  color: $color,
                  fields: $fields,
                  url: $runUrl,
                  timestamp: $timestamp
                }
              ],
              allowed_mentions: { parse: [] }
            }' > /tmp/discord-payload.json

          jq empty /tmp/discord-payload.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::notice::Discord CD 취소 알림을 Skip합니다(DISCORD_CD_WEBHOOK_URL Secret 없음)."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: Skip (\`DISCORD_CD_WEBHOOK_URL\` Secret 없음)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          http_status=$(curl \
            --silent --show-error --output /tmp/discord-response.json --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST --header "Content-Type: application/json" \
            --data @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true") || http_status="curl_error"

          if [ "$http_status" = "curl_error" ] || [ "$http_status" -ge 300 ]; then
            echo "::warning::Discord CD 취소 알림 전송에 실패했습니다(HTTP ${http_status})."
            echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
            echo "- 결과: 전송 실패 (HTTP ${http_status})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Discord 알림" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: 취소 알림 전송 성공" >> "$GITHUB_STEP_SUMMARY"
