name: "✨ Feature Request"
description: "새로운 기능이나 개선 사항을 제안할 때 사용합니다."
title: "[FEAT] "
labels:
  - "✨ feature"
  - "📋 backlog"
body:
  - type: textarea
    id: background
    attributes:
      label: 기능 배경 또는 문제
      description: 이 기능이 왜 필요한지, 어떤 문제를 해결하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: 사용자 관점의 요구사항
      description: |
        가능하다면 아래 형식을 참고해 주세요. 한국어 설명도 괜찮습니다.
      placeholder: |
        As a (사용자 유형)
        I want (원하는 기능)
        So that (얻고자 하는 가치)
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: 제안하는 해결 방법
      description: 어떻게 구현하면 좋을지 아이디어를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 요구사항
      description: 세부 동작, 예외 케이스 등을 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 이 기능이 완료되었다고 판단할 수 있는 기준을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려했던 다른 방법이 있다면 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 그 외 참고할 내용이 있다면 작성해 주세요.
    validations:
      required: false
