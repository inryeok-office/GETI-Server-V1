version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-kotlin:
        patterns:
          - "org.springframework*"
          - "org.jetbrains.kotlin*"
          - "tools.jackson*"
      test-and-quality:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "com.redis:testcontainers-redis"
          - "org.jetbrains.kotlinx:kover*"
          - "dev.detekt*"
          - "com.diffplug.spotless*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
