# 원래 로컬 개발 전용으로 만든 Docker Compose 구성이다.
#
# 평소 개발:
#   docker compose up -d          # PostgreSQL, Redis, MinIO만 실행
#   ./gradlew bootRun             # Spring Boot는 Host에서 직접 실행 (또는 IntelliJ Run)
#
# 전체 Container 환경 검증이 필요할 때만:
#   docker compose --profile app up -d --build
#
# 실제로는 .github/workflows/cd.yml이 develop Branch 배포마다 EC2 서버에서 이 파일로 동일한
# `docker compose --profile app up -d --build`를 실행한다(Registry Push 없이 서버에서 직접
# Source Build, docs/development/docker.md의 "app Profile Dockerfile" 참고). 운영 전용
# Image/Registry 전략(GHCR, ECR 등)은 아직 확정되지 않았다 — 이 Compose 구성이 임시로 그
# 역할까지 겸하고 있다는 뜻이며, 이번 PR의 범위는 이 사실을 문서화하는 것까지다.

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geti}
      POSTGRES_USER: ${POSTGRES_USER:-geti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geti-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geti-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geti-local-minio}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 공고 검색 색인용 Elasticsearch다(Issue #69). Nori(한국어 형태소) Plugin이 필요해 공식 Image를
  # 그대로 쓰지 않고 docker/elasticsearch/Dockerfile로 Plugin만 추가해 Build한다. 인증 없는
  # 단일 Node 구성은 격리된 Local 개발 환경 전용이며 운영에서 재사용할 수 없다.
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 기본 `docker compose up -d`에는 포함되지 않는다. `--profile app`을 명시했을 때만 실행된다.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # /actuator/info의 deployment 필드(DeploymentInfoProperties)에 반영된다. CD가 실제 값을
        # 전달하고, 로컬 `docker compose --profile app up --build`는 기본값을 그대로 쓴다
        # (docs/development/cd.md 참고). APP_ENVIRONMENT도 여기서 함께 받는다 — CD가 `sudo docker
        # compose ...` 명령 자체는 바꾸지 않고 `--build-arg`만으로 네 값을 모두 전달할 수 있게
        # 하기 위함이다(sudoers가 docker 실행만 허용하는 환경에서도 안전).
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
    profiles:
      - app
    # DISCORD_JOB_WEBHOOK_URL(Secret)만 이 파일로 주입한다. required: false라 파일이 없어도
    # (Local 개발에서 이 파일을 만들지 않은 경우) Compose가 오류 없이 그냥 건너뛴다. CD가
    # Deploy마다 이 파일을 갱신한다(.github/workflows/cd.yml). enabled/notify-initial-import
    # 같은 비Secret 값은 여기서 강제로 넣지 않는다 — COLLECTOR_SEED_ENABLED와 같은 이유로
    # Host에서 지정하지 않으면 application-develop.yaml의 기본값을 그대로 쓰게 비워 둔다.
    env_file:
      - path: .env.collector-discord.local
        required: false
    environment:
      # CD(develop 배포)는 SPRING_PROFILES_ACTIVE를 별도로 넘기지 않으므로(docs/development/cd.md),
      # 이 기본값이 실제 develop 서버에 적용되는 Profile이다. develop은 local의 Infra 기본값을
      # Spring Profile Group으로 재사용하고(application.yaml) Collector Seed 기본값만 다르다.
      # 로컬에서 `--profile app`으로 순수 local 동작을 확인하려면 SPRING_PROFILES_ACTIVE=local을
      # 직접 지정한다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-develop}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Host(localhost)가 아닌 Compose Service 이름으로 접속한다.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geti}
      DATABASE_USERNAME: ${POSTGRES_USER:-geti}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-geti-local-only}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      # File 도메인 Object Storage(Issue #85). develop Profile은 local의 설정을 그대로
      # 재사용하므로(application.yaml의 Profile Group) Container 안에서도 MinIO를 쓴다.
      # Host(localhost) 대신 Compose Service 이름으로 접속해야 한다.
      APP_FILE_STORAGE_ENDPOINT: http://minio:9000
      APP_FILE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-geti-local}
      APP_FILE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-geti-local-minio}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-geti-local}
      FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:-ap-northeast-2}
      # Collector 비Secret 설정만 전달한다(Issue #62). 실제 서비스키(COLLECTOR_*_SERVICE_KEY 등)는
      # 이 Compose 구성으로 전달하지 않는다 — develop 서버에는 실제 API Key를 배치하지 않는다.
      # COLLECTOR_SEED_ENABLED는 여기서 강제로 값을 넣지 않는다 — Host에서 지정하지 않으면
      # Spring이 application-develop.yaml의 기본값(true)을 그대로 쓰게 비워 둔다(빈 문자열을
      # 넘기면 Boolean Binding에 실패해 기동이 깨진다). Host에서 재정의하려면 이 Compose를
      # 실행하는 Shell/서버 .env에 COLLECTOR_SEED_ENABLED를 직접 export한다.
      COLLECTOR_EXTERNAL_SCHEDULER_ENABLED: ${COLLECTOR_EXTERNAL_SCHEDULER_ENABLED:-false}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      # 단순 Process 생존(/actuator/health)이 아니라 PostgreSQL/Redis까지 연결된 실제 요청
      # 처리 준비 상태(Readiness)를 기준으로 판단한다. Runtime Image(eclipse-temurin:jre-alpine)에
      # curl이 없어 Alpine 기본 제공 wget(BusyBox)을 사용한다.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-8080}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"
  # develop과 동일한 구성이나, prod Profile 배포 전용. SPRING_PROFILES_ACTIVE=prod로 
  # 실행되며 실제 AWS S3를 사용한다. Port를 8081로 분리해 develop(8080)과 동시에 운영한다.
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        APP_ENVIRONMENT: prod
    profiles:
      - app-prod
    env_file:
      - path: .env.prod
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geti}
      DATABASE_USERNAME: ${POSTGRES_USER:-geti}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-geti-local-only}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "0.0.0.0:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  elasticsearch-data:
